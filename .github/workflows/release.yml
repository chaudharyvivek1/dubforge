name: release

# Builds the sdist and wheel on a tag, checks them, and publishes to PyPI through
# trusted publishing (OIDC — no token in the repo).
#
# One-time setup before the first release:
#   1. On PyPI: add a "pending publisher" for this repository, workflow `release.yml`,
#      environment `pypi`.
#   2. In GitHub: Settings → Environments → new environment `pypi`.
# Until that is done this workflow builds and checks but cannot publish, and
# `pip install dubforge` will not resolve — install from git instead.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*
      - name: Install the wheel in a clean venv and smoke test it
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          /tmp/smoke/bin/dubforge --version
          /tmp/smoke/bin/dubforge doctor
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        continue-on-error: true   # no trusted publisher configured yet: build still succeeds
