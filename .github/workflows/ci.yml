name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12"]
        include:
          - os: macos-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install ffmpeg
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            brew install ffmpeg
          else
            sudo apt-get update && sudo apt-get install -y ffmpeg
          fi
        shell: bash

      - name: Install dubforge
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,mcp]"

      - name: Lint
        run: |
          ruff check src tests
          ruff format --check src tests

      - name: Doctor (must not fail on a supported machine)
        run: python -m dubforge doctor

      # Reference docs are generated from Settings, the live tool list and the argparse
      # tree. If they drift, this fails rather than letting the docs describe a previous
      # release.
      - name: Reference docs are current
        run: python scripts/gen_reference.py --check

      - name: Tests
        run: python -m pytest -q --durations=10

      # The demo is *supposed* to fail QC (stub translation + tone voice) and exit 1.
      # This gate distinguishes that intended failure from a crash, empty JSON, a
      # missing mp4, an unplayable container or a silent track. No `|| true` anywhere:
      # suppressing the exit code is exactly how a broken pipeline ships.
      - name: Offline demo gate (expected QC failure, verified output)
        run: python scripts/ci_demo_check.py --out-dir ci-demo

      - name: MCP server registers all tools and refuses bad input cleanly
        run: |
          python - <<'PY'
          import asyncio, json
          from fastmcp import Client
          from dubforge.server import build_server

          EXPECTED = {"dubforge_doctor", "list_providers", "probe_media", "plan_dub",
                      "transcribe_video", "dub_video", "get_qc", "list_voices",
                      "write_subtitles", "dubforge_version", "dubforge_submit_job",
                      "dubforge_get_job_status", "dubforge_get_job_result",
                      "dubforge_list_jobs", "dubforge_cancel_job", "dubforge_retry_job",
                      "dubforge_cleanup_jobs", "dubforge_get_capabilities",
                      "dubforge_validate_config", "dubforge_check_provider_health",
                      "dubforge_estimate_cost", "dubforge_regenerate_segments"}

          async def main():
              async with Client(build_server()) as client:
                  names = {tool.name for tool in await client.list_tools()}
                  assert names == EXPECTED, names ^ EXPECTED
                  bad = await client.call_tool("plan_dub", {"path": "/nope.mp4", "target_lang": "hi"})
                  payload = json.loads(bad.content[0].text)
                  assert payload["ok"] is False
                  assert payload["error"]["code"] == "missing_file", payload
                  assert "Traceback" not in bad.content[0].text
                  print("mcp ok:", len(names), "tools, structured errors")

          asyncio.run(main())
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: demo-${{ matrix.os }}-${{ matrix.python }}
          path: |
            ci-demo/*.mp4
            ci-demo/*.json
            ci-demo/work/**/qc.json
            ci-demo/work/**/report.md
            ci-demo/work/**/manifest.json
          retention-days: 7

  windows:
    # Windows is where paths, locks and console encodings break first, so it gets a
    # real job rather than a claim in the README. 3.12 only: the oldest supported
    # interpreter is covered on Linux.
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg
        # A system ffmpeg is preferred; if the package manager is unavailable the
        # bundled imageio-ffmpeg binary is used instead, and `doctor` reports which.
        run: choco install ffmpeg -y --no-progress || echo "choco unavailable; the bundled binary will be used"

      - name: Install dubforge
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,mcp]"

      - name: Show the ffmpeg that will actually be used
        run: python -m dubforge doctor

      - name: Reference docs are current
        run: python scripts/gen_reference.py --check

      - name: Lint
        run: |
          ruff check src tests scripts
          ruff format --check src tests scripts

      - name: Tests
        run: python -m pytest -q --durations=10

      - name: Concurrent workspace and MCP tests (run on their own)
        run: python -m pytest -q tests/test_concurrency.py tests/test_workspace.py tests/test_server.py

      - name: Offline demo gate (expected QC failure, verified output)
        run: python scripts/ci_demo_check.py --out-dir ci-demo

      - name: MCP startup, tool registration and structured errors
        run: |
          python - <<'PY'
          import asyncio, json
          from fastmcp import Client
          from dubforge.server import build_server

          EXPECTED = {"dubforge_doctor", "list_providers", "probe_media", "plan_dub",
                      "transcribe_video", "dub_video", "get_qc", "list_voices",
                      "write_subtitles", "dubforge_version", "dubforge_submit_job",
                      "dubforge_get_job_status", "dubforge_get_job_result",
                      "dubforge_list_jobs", "dubforge_cancel_job", "dubforge_retry_job",
                      "dubforge_cleanup_jobs", "dubforge_get_capabilities",
                      "dubforge_validate_config", "dubforge_check_provider_health",
                      "dubforge_estimate_cost", "dubforge_regenerate_segments"}

          async def main():
              async with Client(build_server()) as client:
                  names = {tool.name for tool in await client.list_tools()}
                  assert names == EXPECTED, names ^ EXPECTED
                  bad = await client.call_tool("plan_dub", {"path": "C:/nope.mp4", "target_lang": "hi"})
                  payload = json.loads(bad.content[0].text)
                  assert payload["ok"] is False and payload["error"]["code"] == "missing_file", payload
                  print("mcp ok:", len(names), "tools")

          asyncio.run(main())
          PY

      - name: Workspace locking, isolation and cleanup on Windows
        run: |
          python - <<'PY'
          import json, time, threading
          from pathlib import Path
          from tempfile import mkdtemp
          from dubforge.workspace import open_job

          root = Path(mkdtemp())
          source = root / "lesson.mp4"
          source.write_bytes(b"x")

          a = open_job(root / "work", source, fingerprint="f")
          b = open_job(root / "work", source, fingerprint="f")   # concurrent: must get its own dir
          assert a.path != b.path, (a.path, b.path)

          (a.path / "tts").mkdir()
          (a.path / "tts" / "0.wav").write_bytes(b"x")
          removed = a.cleanup()
          assert "tts" in removed and not (a.path / "tts").exists()
          assert (b.path / ".lock").exists(), "the second job lost its lock"

          a.release()
          b.release()
          assert not (a.path / ".lock").exists()

          # a stale lock from a killed process must be reclaimed on Windows too
          c = open_job(root / "work", source, fingerprint="f")
          c.release()
          (c.path / ".lock").write_text("", encoding="utf-8")
          old = time.time() - 90000
          import os
          os.utime(c.path / ".lock", (old, old))
          d = open_job(root / "work", source, fingerprint="f")
          assert d.path == c.path, "stale lock was not reclaimed"
          d.release()
          print("workspace ok on", os.name)
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: demo-windows
          path: |
            ci-demo/*.mp4
            ci-demo/*.json
            ci-demo/work/**/qc.json
          retention-days: 7

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine && python -m build
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
